name: AP-Bot Runner

on:
  schedule:
    - cron: '*/10 * * * *' # Запускать каждые 10 минут
  workflow_dispatch: # Позволяет запустить вручную

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          GITHUB_TOKEN_SECRET: ${{ secrets.GITHUB_TOKEN }} # GitHub сам подставит токен
        run: python server.py
