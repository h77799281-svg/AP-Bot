<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AP-Archive: v1.0</title>
    
    <!-- Подключаем Supabase -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
        window.supabase = createClient('https://kvpzrpqwbsrgyxsgcowc.supabase.co', 'sb_publishable_jlSw4v_rY_fD0if0WtkzDw_0qxlVmqA');
    </script>
    
    <style>
        body { margin: 0; padding: 0; background-color: #050508; color: #00FFCC; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; min-height: 100vh; background-image: radial-gradient(circle at center, #111a33 0%, #050508 100%); padding: 20px 0; }
        .container { text-align: center; border: 2px solid #FF3B30; padding: 20px; border-radius: 10px; background: rgba(0, 0, 0, 0.8); box-shadow: 0 0 30px rgba(255, 59, 48, 0.3); width: 90%; max-width: 800px; margin-bottom: 20px; }
        h1 { color: #FF3B30; text-transform: uppercase; letter-spacing: 3px; text-shadow: 0 0 10px #FF3B30; margin-top: 0; }
        .virus-image { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 4px solid #FF3B30; box-shadow: 0 0 30px #FF3B30; margin: 10px 0; animation: float 3s ease-in-out infinite; cursor: pointer; }
        .virus-image:active { transform: scale(0.95); }
        @keyframes float { 0% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-10px) rotate(2deg); } 100% { transform: translateY(0px) rotate(0deg); } }
        .log { text-align: left; background: #000; padding: 10px; border-left: 4px solid #00FFCC; font-size: 12px; margin-top: 10px; height: 60px; overflow-y: auto; }
        .blink { animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
        
        .profiles-section { width: 90%; max-width: 800px; display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin-top: 20px; }
        .profile-card { background: rgba(17, 17, 17, 0.9); border: 1px solid #1E3A8A; border-radius: 8px; padding: 15px; width: 220px; text-align: left; box-shadow: 0 0 15px rgba(30, 58, 138, 0.5); position: relative; overflow: hidden; cursor: pointer; transition: 0.2s; }
        .profile-card:hover { transform: translateY(-5px); border-color: #00FFCC; }
        .profile-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: #00FFCC; }
        .profile-name { font-size: 16px; font-weight: bold; margin-bottom: 5px; color: #fff; margin-left: 50px; }
        .profile-role { font-size: 11px; color: #888; margin-bottom: 10px; text-transform: uppercase; margin-left: 50px; }
        .profile-level { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; text-transform: uppercase; margin-top: 10px; }
        .lvl-admin { background: #FF3B30; color: #fff; box-shadow: 0 0 10px #FF3B30; }
        .lvl-creator { background: #4B0082; color: #00FFCC; box-shadow: 0 0 10px #4B0082; }
        .lvl-user { background: #1E3A8A; color: #fff; }
        .lvl-boss { background: #FF00CC; color: #fff; box-shadow: 0 0 10px #FF00CC; }
        .profile-stats { margin-top: 10px; font-size: 11px; color: #aaa; }
        .avatar-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; position: absolute; top: 15px; left: 15px; border: 2px solid #00FFCC; }

        .admin-panel { display: none; width: 90%; max-width: 800px; background: rgba(0,0,0,0.9); border: 2px dashed #00FFCC; padding: 15px; margin-top: 20px; border-radius: 10px; text-align: center; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: #111; border: 2px solid #00FFCC; padding: 20px; border-radius: 10px; width: 320px; text-align: center; }
        .modal-content input, .modal-content select { width: 90%; margin-bottom: 10px; padding: 8px; background: #000; color: #00FFCC; border: 1px solid #1E3A8A; }
        .btn-save { background: #00FFCC; color: #000; width: 45%; padding: 10px; border: none; font-weight: bold; cursor: pointer; }
        .btn-cancel { background: #FF3B30; color: #fff; width: 45%; padding: 10px; border: none; font-weight: bold; cursor: pointer; }

        .chat-container { width: 90%; max-width: 800px; margin-top: 20px; background: rgba(0,0,0,0.9); border: 1px solid #1E3A8A; border-radius: 8px; padding: 15px; }
        .chat-box { height: 250px; overflow-y: auto; border: 1px solid #333; padding: 10px; margin-bottom: 10px; background: #000; font-size: 13px; text-align: left; }
        .chat-input-row { display: flex; gap: 5px; align-items: center; }
        .chat-input-row input { background: #111; color: #fff; border: 1px solid #1E3A8A; padding: 8px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚠️ Virus Detected</h1>
        <p>Объект: <b>Koch-Koch Bratan</b></p>
        <img src="../../virus.jpg" alt="Koch-Koch" class="virus-image" id="virusImg">
        <div class="log" id="log">> Инициализация...<br>> Ожидание действий<span class="blink">_</span></div>
    </div>

    <div style="text-align: center;">
        <button onclick="activateAdmin()" style="background: transparent; color: #333; border: 1px solid #333; padding: 5px; cursor: pointer;">⚙️ System Access</button>
    </div>

    <div class="admin-panel" id="userPanel" style="border-color: #4B0082;">
        <h3 style="color:#4B0082; margin-top:0;">👤 Панель Участника</h3>
        <button onclick="openAddForm()" style="background: #4B0082; color: #00FFCC; border: 1px solid #00FFCC; padding: 8px 15px; cursor: pointer;">➕ Добавить себя</button>
    </div>

    <div class="admin-panel" id="adminPanel">
        <h3 style="color:#00FFCC; margin-top:0;">🛠️ Терминал Управления (Admin)</h3>
        <button onclick="openAddForm()" style="background: #00FFCC; color: #000; border: none; padding: 8px 15px; cursor: pointer; font-weight: bold;">➕ Добавить</button>
        <button onclick="clearAllUsers()" style="background: #FF3B30; color: #fff; border: none; padding: 8px 15px; cursor: pointer; font-weight: bold; margin-left: 10px;">🗑 Очистить</button>
    </div>

    <div class="modal" id="addModal">
        <div class="modal-content" style="width: 350px;">
            <h3 style="color:#00FFCC;">Добавление бойца</h3>
            <div style="display: flex; gap: 10px; margin-bottom: 15px; text-align: left;">
                <div style="width: 80px; height: 100px; border: 2px solid #1E3A8A; border-radius: 10px; position: relative; overflow: hidden; background: #000;">
                    <img id="photoPreview" style="width: 100%; height: 100%; object-fit: cover; display: none;">
                    <span id="photoText" style="color: #555; font-size: 10px; position: absolute; top: 35%; left: 10%; text-align: center;">Фото</span>
                    <input type="file" id="photoInput" accept="image/*" style="position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer;" onchange="previewPhoto(this)">
                </div>
                <div style="flex: 1;">
                    <label style="font-size: 10px; color: #888;">Ф.И.О</label>
                    <input type="text" id="addName" style="width: 100%; padding: 5px; background: transparent; color: #fff; border: none; border-bottom: 1px solid #00FFCC; outline: none;">
                    <label style="font-size: 10px; color: #888; margin-top: 10px; display: block;">Специальность</label>
                    <input type="text" id="addRole" style="width: 100%; padding: 5px; background: transparent; color: #fff; border: none; border-bottom: 1px solid #00FFCC; outline: none;">
                    <label style="font-size: 10px; color: #888; margin-top: 10px; display: block;">LVL</label>
                    <input type="number" id="addLevel" value="1" style="width: 100%; padding: 5px; background: transparent; color: #fff; border: none; border-bottom: 1px solid #00FFCC; outline: none;">
                </div>
            </div>
            <div>
                <button class="btn-save" onclick="submitNewUser()">Добавить</button>
                <button class="btn-cancel" onclick="closeAddModal()">Отмена</button>
            </div>
        </div>
    </div>

    <div class="modal" id="editModal">
        <div class="modal-content">
            <h3 style="color:#00FFCC;">Редактирование</h3>
            <input type="text" id="editName" placeholder="Имя">
            <input type="text" id="editRole" placeholder="Роль">
            <select id="editLevel">
                <option value="User">User</option>
                <option value="Creator">Creator</option>
                <option value="Boss">Boss</option>
                <option value="Admin">Admin</option>
            </select>
            <input type="number" id="editPower" placeholder="Мощность">
            <input type="text" id="editAccess" placeholder="Доступ">
            <div>
                <button class="btn-save" onclick="saveEdit()">Сохранить</button>
                <button class="btn-cancel" onclick="closeModal()">Отмена</button>
            </div>
        </div>
    </div>

    <div class="profiles-section" id="profilesContainer"><p>Загрузка...</p></div>

    <div class="chat-container">
        <h3 style="color: #00FFCC; margin-top: 0;">💬 Секретный чат</h3>
        <div id="chatMessages" class="chat-box"></div>
        <div class="chat-input-row">
            <input type="text" id="chatName" placeholder="Ник" style="width: 80px;">
            <input type="text" id="chatInput" placeholder="Сообщение..." style="flex: 1;">
            <input type="file" id="fileInput" style="display: none;" onchange="uploadFile()">
            <button onclick="document.getElementById('fileInput').click()" style="background: #4B0082; color: #00FFCC; border: 1px solid #00FFCC; padding: 8px 12px; cursor: pointer;">📎</button>
            <button onclick="sendMessage()" style="background: #00FFCC; color: #000; border: none; padding: 8px 15px; font-weight: bold; cursor: pointer;">Ввод</button>
            <button id="clearChatBtn" onclick="clearChat()" style="background: #FF3B30; color: #fff; border: none; padding: 8px 15px; font-weight: bold; cursor: pointer; display: none;">🗑</button>
        </div>
    </div>

    <script>
        let currentUsers = []; let editingIndex = null; let accessLevel = "none"; let selectedPhotoFile = null;

        document.getElementById('virusImg').addEventListener('click', () => {
            document.getElementById('log').innerHTML += "<br>> <span style='color:#FF3B30;'>Вирус активирован!</span>";
        });

        function activateAdmin() {
            const pwd = prompt("Введите код доступа:");
            if (pwd === "2609") {
                accessLevel = "admin"; document.getElementById('adminPanel').style.display = 'block'; document.getElementById('userPanel').style.display = 'none'; document.getElementById('clearChatBtn').style.display = 'block';
                renderUsers();
            } else if (pwd === "2208") {
                accessLevel = "user"; document.getElementById('adminPanel').style.display = 'none'; document.getElementById('userPanel').style.display = 'block'; document.getElementById('clearChatBtn').style.display = 'none';
                renderUsers();
            } else if (pwd) { alert("Неверный пароль"); }
        }

        async function loadData() {
            const { data } = await supabase.from('users').select('*').order('id');
            if (data) { currentUsers = data; renderUsers(); }
        }

        function renderUsers() {
            const container = document.getElementById('profilesContainer'); container.innerHTML = '';
            currentUsers.forEach((user, index) => {
                let levelClass = user.level === 'Admin' ? 'lvl-admin' : (user.level === 'Creator' ? 'lvl-creator' : (user.level === 'Boss' ? 'lvl-boss' : 'lvl-user'));
                const clickAttr = (accessLevel === "admin") ? `onclick="openEdit(${index})"` : '';
                let avatarHtml = user.avatar_url ? `<img src="${user.avatar_url}" class="avatar-img">` : '';
                container.innerHTML += `
                    <div class="profile-card" ${clickAttr}>
                        ${avatarHtml}<div class="profile-name">${user.name}</div>
                        <div class="profile-role">${user.role}</div>
                        <div class="profile-level ${levelClass}">${user.level}</div>
                        <div class="profile-stats">Power: ${user.power}<br>Access: ${user.access}</div>
                    </div>`;
            });
        }

        function openAddForm() { if (accessLevel !== "none") document.getElementById('addModal').style.display = 'flex'; }
        function closeAddModal() { document.getElementById('addModal').style.display = 'none'; }
        
        function previewPhoto(input) {
            if (input.files && input.files[0]) {
                selectedPhotoFile = input.files[0];
                const reader = new FileReader();
                reader.onload = (e) => { document.getElementById('photoPreview').src = e.target.result; document.getElementById('photoPreview').style.display = 'block'; document.getElementById('photoText').style.display = 'none'; };
                reader.readAsDataURL(selectedPhotoFile);
            }
        }

        async function submitNewUser() {
            const name = document.getElementById('addName').value.trim();
            const role = document.getElementById('addRole').value.trim();
            const level = parseInt(document.getElementById('addLevel').value) || 1;
            if (!name || !role) return alert("Заполни поля!");
            
            let photoUrl = null;
            if (selectedPhotoFile) {
                const fileName = `avatar_${Date.now()}.jpg`;
                await supabase.storage.from('chat_files').upload(fileName, selectedPhotoFile);
                const { data } = supabase.storage.from('chat_files').getPublicUrl(fileName);
                photoUrl = data.publicUrl;
            }
            let rank = level > 50 ? "Admin" : (level > 20 ? "Boss" : (level > 5 ? "Creator" : "User"));
            
            await supabase.from('users').insert([{ name, role, level: rank, power: level * 100, access: "LIMITED", avatar_url: photoUrl }]);
            closeAddModal(); loadData();
        }

        function openEdit(index) {
            editingIndex = index; const user = currentUsers[index];
            document.getElementById('editName').value = user.name; document.getElementById('editRole').value = user.role;
            document.getElementById('editLevel').value = user.level; document.getElementById('editPower').value = user.power;
            document.getElementById('editAccess').value = user.access; document.getElementById('editModal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('editModal').style.display = 'none'; }
        
        async function saveEdit() {
            if (editingIndex === null) return;
            const user = currentUsers[editingIndex];
            await supabase.from('users').update({ name: document.getElementById('editName').value, role: document.getElementById('editRole').value, level: document.getElementById('editLevel').value, power: parseInt(document.getElementById('editPower').value), access: document.getElementById('editAccess').value }).eq('id', user.id);
            closeModal(); loadData();
        }
        async function clearAllUsers() { if (confirm("Удалить всех?")) { await supabase.from('users').delete().gt('id', 0); loadData(); } }

        const chatBox = document.getElementById('chatMessages');
        async function loadMessages() {
            const { data } = await supabase.from('messages').select('*').order('created_at', { ascending: true });
            if (!data) return;
            chatBox.innerHTML = '';
            data.forEach(msg => {
                const time = new Date(msg.created_at).toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'});
                let content = `<span style="color: #fff;">${msg.text}</span>`;
                if (msg.file_url) content += msg.file_url.match(/\.(jpeg|jpg|gif|png)$/i) ? `<br><img src="${msg.file_url}" style="max-width: 100%; max-height: 150px; border-radius: 5px; margin-top: 5px;">` : `<br><a href="${msg.file_url}" target="_blank" style="color: #00FFCC;">📥 Файл</a>`;
                let delBtn = (accessLevel === "admin") ? `<button onclick="deleteMessage(${msg.id})" style="background: transparent; color: #FF3B30; border: none; cursor: pointer; float: right;">✕</button>` : '';
                chatBox.innerHTML += `<div style="margin-bottom: 10px; border-bottom: 1px solid #222; position: relative;">${delBtn}<span style="color: #00FFCC; font-weight: bold;">${msg.name}</span> <span style="color: #555; font-size: 10px;">[${time}]</span><br>${content}</div>`;
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }
        async function sendMessage() {
            const name = document.getElementById('chatName').value.trim() || 'Аноним';
            const text = document.getElementById('chatInput').value.trim(); if (!text) return;
            await supabase.from('messages').insert([{ name, text }]); document.getElementById('chatInput').value = ''; loadMessages();
        }
        async function uploadFile() {
            const file = document.getElementById('fileInput').files[0]; if (!file) return;
            const name = document.getElementById('chatName').value.trim() || 'Аноним';
            const fileName = `${Date.now()}_${file.name}`;
            await supabase.storage.from('chat_files').upload(fileName, file);
            const { data } = supabase.storage.from('chat_files').getPublicUrl(fileName);
            await supabase.from('messages').insert([{ name, text: `Отправил файл: ${file.name}`, file_url: data.publicUrl }]);
            document.getElementById('fileInput').value = ''; loadMessages();
        }
        async function deleteMessage(id) { if (accessLevel === "admin" && confirm("Удалить?")) { await supabase.from('messages').delete().eq('id', id); loadMessages(); } }
        async function clearChat() { if (accessLevel === "admin" && confirm("Удалить ВСЁ?")) { await supabase.from('messages').delete().gt('id', 0); loadMessages(); } }

        loadData(); loadMessages(); setInterval(loadMessages, 3000);
    </script>
</body>
</html>
