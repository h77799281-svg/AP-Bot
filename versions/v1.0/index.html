<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050508">
<title>AP-Archive | Admin OS</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/wasmoon@1.16.0/dist/index.js"></script>

<style>
:root{--bg:#050508;--card:#111;--border:#222;--neon:#00ff00;--gold:#FFD700;--cyan:#00FFCC;--muted:#888}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:#fff;font-family:'Courier New',monospace;min-height:100vh;-webkit-tap-highlight-color:transparent}
.screen{display:none}.screen.active{display:block}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px}
h1{color:var(--gold);text-align:center;margin-bottom:8px;text-shadow:0 0 12px rgba(255,215,0,.5)}
.sub{color:var(--muted);font-size:13px;margin-bottom:25px;text-align:center}
input,select,button{width:100%;max-width:340px;padding:14px;margin:6px 0;background:var(--card);color:#fff;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:16px;outline:none}
input:focus,select:focus{border-color:var(--neon)}
button{background:var(--neon);color:#000;font-weight:bold;border:none;cursor:pointer}
button:active{transform:scale(.98)}
button.sec{background:transparent;color:var(--neon);border:1px solid var(--neon)}
button.red{background:#d9534f;color:#fff}
.header{display:flex;justify-content:space-between;align-items:center;padding:14px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.badge{padding:4px 10px;border-radius:12px;font-size:11px;font-weight:bold;color:#000}
.wrap{padding:18px}
.title{color:var(--cyan);margin:22px 0 10px;font-size:16px}
.card{display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--card);border-radius:8px;border-left:4px solid var(--muted);margin-bottom:9px}
.btn-dm{background:var(--cyan);color:#000;padding:8px 13px;border-radius:6px;font-size:12px;width:auto;margin:0}
.console{background:#000;border:1px solid var(--neon);border-radius:8px;padding:12px;margin-top:18px}
.console-out{color:#0f0;font-size:12px;max-height:170px;overflow-y:auto;margin-bottom:10px;line-height:1.6}
.row{display:flex;gap:7px}.row input,.row select{margin:0}.row button{width:auto;padding:12px 16px;margin:0}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;justify-content:center;align-items:center}
.modal.active{display:flex}
.mbox{background:var(--card);width:95%;max-width:440px;height:80vh;border:1px solid var(--gold);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
.mhead{padding:13px;background:#1a1a1a;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.msgs{flex:1;padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.msg{max-width:76%;padding:9px 13px;border-radius:12px;font-size:14px;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--neon);color:#000}
.msg.other{align-self:flex-start;background:#333}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--cyan);padding:12px 18px;border:1px solid var(--cyan);border-radius:8px;z-index:200;display:none;font-size:13px;max-width:90%}
.toast.show{display:block}
.hidden{display:none!important}
.vip{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 8px rgba(255,215,0,.3)}50%{box-shadow:0 0 22px rgba(255,215,0,.6)}}
</style>
</head>
<body>

<!-- ВХОД -->
<div id="s-login" class="screen active"><div class="center">
  <h1>🔐 AP-ARCHIVE</h1>
  <p class="sub" id="lua-status">Загрузка Lua-ядра...</p>
  <input type="password" id="l-code" placeholder="••••" maxlength="4" style="text-align:center;letter-spacing:8px;font-size:24px">
  <button onclick="doLogin()">ВОЙТИ</button>
  <button class="sec" onclick="go('s-reg')">РЕГИСТРАЦИЯ</button>
</div></div>

<!-- РЕГИСТРАЦИЯ -->
<div id="s-reg" class="screen"><div class="center">
  <h1>📝 АКТИВАЦИЯ</h1>
  <p class="sub">Проверка через Lua-модуль</p>
  <input type="text" id="r-name" placeholder="Никнейм / ФИО" maxlength="20">
  <select id="r-role">
    <option>Участник</option><option>Модератор</option><option>Разработчик</option>
  </select>
  <input type="password" id="r-code" placeholder="Код доступа" maxlength="4">
  <button onclick="doRegister()">АКТИВИРОВАТЬ</button>
  <button class="sec" onclick="go('s-login')">НАЗАД</button>
</div></div>

<!-- ГЛАВНЫЙ -->
<div id="s-main" class="screen">
  <div class="header">
    <div><b id="u-name"></b> <span id="u-badge" class="badge"></span></div>
    <button class="red" style="width:auto;padding:8px 12px;margin:0" onclick="logout()">🚪</button>
  </div>
  <div class="wrap">
    <h2 id="welcome" style="font-size:17px;margin-bottom:6px"></h2>
    <p style="color:var(--muted);font-size:11px" id="token-info"></p>

    <div id="terminal" class="console hidden">
      <div style="color:var(--neon);font-weight:bold;margin-bottom:8px">💻 ТЕРМИНАЛ</div>
      <div class="console-out" id="out">&gt; Система готова...</div>
      <div class="row">
        <select id="lang" style="max-width:110px">
          <option value="lua">Lua</option>
          <option value="js">JS</option>
          <option value="sez">SEZ</option>
        </select>
        <input type="text" id="cmd" placeholder="Команда...">
        <button onclick="runCmd()">▶</button>
      </div>
    </div>

    <h3 class="title">👥 УЧАСТНИКИ И АДМИНЫ</h3>
    <div id="users">Загрузка...</div>
  </div>
</div>

<!-- ЛС -->
<div id="dm" class="modal"><div class="mbox">
  <div class="mhead">
    <span style="color:var(--gold);font-weight:bold">💬 <span id="dm-name"></span></span>
    <button class="red" style="width:auto;padding:6px 12px;margin:0" onclick="closeDM()">✕</button>
  </div>
  <div class="msgs" id="msgs"></div>
  <div class="row" style="padding:12px;background:#1a1a1a;border-top:1px solid var(--border)">
    <input type="text" id="dm-text" placeholder="Сообщение...">
    <button onclick="sendDM()">➤</button>
  </div>
</div></div>

<div id="toast" class="toast"></div>

<script>
const SB_URL='https://kvpzrpqwbsrgyxsgcowc.supabase.co';
const SB_KEY='sb_publishable_jlSw4v_rY_fD0if0WtkzDw_0qxlVmqA';
const sb=window.supabase.createClient(SB_URL,SB_KEY);

let lua=null, me=null, partner=null, channel=null;

// === ЗАГРУЗКА LUA ===
async function initLua(){
  try{
    const factory = wasmoon.LuaFactory ? new wasmoon.LuaFactory() : null;
    lua = factory ? await factory.createEngine() : await wasmoon.create();
    const res = await fetch('game_logic.lua');
    if(!res.ok) throw new Error('game_logic.lua не найден');
    const code = await res.text();
    if(lua.doString) await lua.doString(code); else await lua.doStringSync(code);
    document.getElementById('lua-status').textContent='🌙 Lua-ядро активно';
    log('Lua-модуль загружен','sys');
  }catch(e){
    document.getElementById('lua-status').textContent='⚠️ Lua offline — резервный режим';
    console.error(e);
  }
}

// Вызов Lua-функции с fallback на JS
async function callLua(fn,...args){
  try{
    if(lua && lua.global){ const f=lua.global.get(fn); if(f) return await f(...args); }
    if(lua && lua.global){ return await lua.global.call?.(fn,...args); }
  }catch(e){ console.warn('Lua fallback:',fn,e); }
  return jsFallback(fn,args);
}

function jsFallback(fn,[a,b]){
  const codes={'2609':'Admin:admin','2208':'Creator:creator','6767':'VIP:vip_user'};
  if(fn==='check_access_code') return codes[a]||'Denied';
  if(fn==='generate_token') return 'AP-'+Math.random().toString(36).slice(2)+Date.now().toString(36);
  if(fn==='get_greeting') return `✅ ${a} подключён.`;
  if(fn==='get_badge_color') return b==='admin'?'#00ff00':b==='vip_user'?'#FFD700':'#888888';
  if(fn==='validate_name') return a.length>=2&&a.length<=20;
  if(fn==='get_system_phrase') return 'Система стабильна.';
  return null;
}

// === UI ===
function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3000)}
function log(t,type='ok'){const o=document.getElementById('out');if(!o)return;const c=type==='err'?'#f44':type==='sys'?'#00FFCC':'#0f0';o.innerHTML+=`<div style="color:${c}">[${new Date().toLocaleTimeString('ru-RU')}] &gt; ${t}</div>`;o.scrollTop=o.scrollHeight}

// === СТАРТ ===
window.onload=async()=>{
  await initLua();
  const saved=localStorage.getItem('ap_user');
  if(saved){me=JSON.parse(saved);enter();}
};

// === РЕГИСТРАЦИЯ ===
async function doRegister(){
  const name=document.getElementById('r-name').value.trim();
  const role=document.getElementById('r-role').value;
  const code=document.getElementById('r-code').value.trim();
  if(!name||!code) return toast('Заполни все поля!');

  if(!await callLua('validate_name',name)) return toast('Ник: 2-20 символов, буквы/цифры/_');

  const status=await callLua('check_access_code',code);
  if(status==='Denied') return toast('🔑 Неверный код доступа!');

  const [rank,level]=status.split(':');
  const token=await callLua('generate_token');

  const {data:exists}=await sb.from('users').select('id').eq('name',name).maybeSingle();
  if(exists) return toast('⚠️ Этот ник уже занят!');

  const {data,error}=await sb.from('users').insert([{name,role,rank,level,access_code:code,token}]).select().single();
  if(error) return toast('Ошибка БД: '+error.message);

  me=data; localStorage.setItem('ap_user',JSON.stringify(data));
  enter();
}

// === ВХОД ===
async function doLogin(){
  const code=document.getElementById('l-code').value.trim();
  if(!code) return toast('Введите код!');
  const status=await callLua('check_access_code',code);
  if(status==='Denied') return toast('🔑 Неверный код!');

  const {data,error}=await sb.from('users').select('*').eq('access_code',code).limit(1).maybeSingle();
  if(error||!data) return toast('Профиль не найден. Зарегистрируйся!');

  me=data; localStorage.setItem('ap_user',JSON.stringify(data));
  enter();
}

// === ГЛАВНЫЙ ЭКРАН ===
async function enter(){
  go('s-main');
  document.getElementById('u-name').textContent=me.name;
  const badge=document.getElementById('u-badge');
  badge.textContent=me.rank;
  badge.style.background=await callLua('get_badge_color',me.level);
  document.getElementById('welcome').textContent=await callLua('get_greeting',me.name,me.level);
  document.getElementById('token-info').textContent='Токен: '+(me.token||'—');

  if(me.level==='vip_user') document.body.classList.add('vip');
  if(me.level==='admin'){
    document.getElementById('terminal').classList.remove('hidden');
    log(await callLua('get_system_phrase'),'sys');
  }
  loadUsers();
  subscribeGlobal();
}

// === СПИСОК УЧАСТНИКОВ ===
async function loadUsers(){
  const {data,error}=await sb.from('users').select('id,name,rank,level,role').order('created_at',{ascending:false});
  const box=document.getElementById('users');
  if(error){box.textContent='Ошибка: '+error.message;return}
  box.innerHTML='';
  for(const u of data){
    const color=await callLua('get_badge_color',u.level);
    const div=document.createElement('div');
    div.className='card'; div.style.borderLeftColor=color;
    div.innerHTML=`<div><b>${u.name}</b> <span class="badge" style="background:${color}">${u.rank}</span>
      <div style="font-size:11px;color:var(--muted);margin-top:3px">${u.role||''}</div></div>`;
    if(u.id!==me.id){
      const b=document.createElement('button');
      b.className='btn-dm'; b.textContent='💬 ЛС';
      b.onclick=()=>openDM(u.id,u.name);
      div.appendChild(b);
    }
    box.appendChild(div);
  }
}

// === ЛС + WEBSOCKET ===
function openDM(id,name){
  partner={id,name};
  document.getElementById('dm-name').textContent=name;
  document.getElementById('dm').classList.add('active');
  loadMsgs();
  if(channel) sb.removeChannel(channel);
  channel=sb.channel('dm-room').on('postgres_changes',
    {event:'INSERT',schema:'public',table:'direct_messages'},
    p=>{
      const m=p.new;
      const mine=(m.sender_id===me.id&&m.receiver_id===partner?.id)||(m.sender_id===partner?.id&&m.receiver_id===me.id);
      if(mine) append(m); else toast('💬 Новое сообщение!');
    }).subscribe();
}
function closeDM(){document.getElementById('dm').classList.remove('active');partner=null;if(channel){sb.removeChannel(channel);channel=null}}

async function loadMsgs(){
  const {data,error}=await sb.from('direct_messages').select('*')
    .or(`and(sender_id.eq.${me.id},receiver_id.eq.${partner.id}),and(sender_id.eq.${partner.id},receiver_id.eq.${me.id})`)
    .order('created_at',{ascending:true});
  const box=document.getElementById('msgs'); box.innerHTML='';
  if(error){box.innerHTML='<div style="color:#f44">'+error.message+'</div>';return}
  (data||[]).forEach(append);
}
function append(m){
  const box=document.getElementById('msgs');
  const d=document.createElement('div');
  d.className='msg '+(m.sender_id===me.id?'me':'other');
  d.textContent=m.content;
  box.appendChild(d); box.scrollTop=box.scrollHeight;
}
async function sendDM(){
  const inp=document.getElementById('dm-text');
  const text=inp.value.trim();
  if(!text||!partner) return;
  const {error}=await sb.from('direct_messages').insert([{sender_id:me.id,receiver_id:partner.id,content:text}]);
  if(error) return toast('Ошибка: '+error.message);
  inp.value='';
}

function subscribeGlobal(){
  sb.channel('notify').on('postgres_changes',
    {event:'INSERT',schema:'public',table:'direct_messages',filter:`receiver_id=eq.${me.id}`},
    ()=>{ if(!partner) toast('🔔 Тебе написали в ЛС!'); }).subscribe();
}

// === ТЕРМИНАЛ ===
async function runCmd(){
  const lang=document.getElementById('lang').value;
  const code=document.getElementById('cmd').value.trim();
  if(!code) return;
  log(`[${lang.toUpperCase()}] ${code}`,'sys');
  try{
    if(lang==='lua'){
      if(!lua) throw new Error('Lua не загружен');
      let buf='';
      lua.global.set('print',(...a)=>{buf+=a.join(' ')+'\n'});
      await lua.doString(code);
      log(buf||'Выполнено (без вывода)');
    }else if(lang==='js'){
      const oldLog=console.log; let buf='';
      console.log=(...a)=>{buf+=a.join(' ')+'\n'};
      eval(code); console.log=oldLog;
      log(buf||'Выполнено');
    }else if(lang==='sez'){
      const {error}=await sb.from('interface').upsert({id:1,html_code:code});
      log(error?'Ошибка: '+error.message:'Интерфейс обновлён для всех!');
    }
  }catch(e){log('Ошибка: '+e.message,'err')}
  document.getElementById('cmd').value='';
}

function logout(){localStorage.removeItem('ap_user');location.reload()}
</script>
</body>
</html>
